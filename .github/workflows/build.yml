name: Build WakeMaster APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace -Djava.awt.headless=true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakeMaster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WakeMaster Release v${{ github.run_number }}
          body: |
            ## WakeMaster - גרסה חדשה
            - נבנה אוטומטית באמצעות GitHub Actions
            - כולל שעון מעורר מתקדם עם 6 סוגי משימות השכמה
            - מצב נעילת משימה (Level A & Level B Device Owner)
            - תמיכה מלאה בעברית ו-RTL
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
